<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antwort prüfen</title>
  <!-- Fonts from Google: the two preconnect lines make the download start early, the third loads IBM Plex Mono and the pixel font Press Start 2P. Every page needs these three lines. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/keyboard.css">
  <link rel="stylesheet" href="css/check.css">
  <link rel="stylesheet" href="css/kapitel-2.css"> <!-- retro theme; only switches on when page.js sets data-kapitel="2" -->
</head>
<body>
  <header class="site-header">
    <!-- Site title: aria-label lets screen readers say "Analingo" as one word; the A in .flip turns upside down on hover (style.css) -->
    <a class="site-title" href="index.html" aria-label="Analingo"><span class="flip">A</span>nalingo</a>
    <nav>
    <a href="index.html">Karte</a>
    <a href="axiome.html">Axiome</a>
    <a href="fortschritt.html">Fortschritt</a>
    </nav>
  </header>

  <main>
    <!-- page.js fills in the title and the question from the JSON file -->
    <!-- The title on the left, the buttons on the bottom -->
    <div class="title-row">
      <h1>Lädt …</h1>
      <div class="actions">
        <button type="button" id="check-button">Prüfen</button>
        <button type="button" id="backspace-button">⌫</button>
        <button type="button" id="clear-button" aria-label="Leeren">
          <span class="label">Leeren</span>
          <span class="label-hover">∅</span>
        </button>

        <button type="button" id="random-button">Random</button>
      </div>
    </div>
    <p id="prompt"></p>

    <!-- The answer bar now has the full width -->
    <div id="answer-slots">
      <span class="answer-hint">Tippe auf ein Symbol</span>
    </div>

    <!-- page.js writes "Richtig!" or "Noch nicht" here -->
    <p id="feedback"></p>

    <!-- The tip: <details> opens and closes on click all by itself, no JavaScript needed.
         "hidden" keeps it invisible until page.js finds a tip in the item file. -->
    <details id="hint" hidden>
      <summary>Tipp</summary>
      <p id="hint-text"></p>
    </details>

    <!-- weiter.js fills this with "← Zurück · Axiom 3 von 16 · Weiter →" -->
    <nav class="item-nav" id="item-nav"></nav>

    <div id="symbol-keyboard"></div>
  </main>

  <script src="js/Keyboard.js"></script>
  <!-- MOVEABLE: lets you drag the tiles in the answer bar to reorder them -->
  <script type="module" src="js/moveable.js"></script>
  <!-- type="module" is needed because page.js uses await -->
  <script type="module" src="js/page.js"></script>
  <script type="module" src="js/weiter.js"></script> <!-- the Zurück / Weiter links -->
  <script type="module" src="js/random.js"></script>
<script type="module" src="js/kapitel-2.js"></script> <!-- title bar, trail, Epsi, taskbar: only on Kapitel 2 -->
</body>
</html>
