<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antwort prüfen</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/keyboard.css">
  <link rel="stylesheet" href="css/check.css">
</head>
<body>
  <main>
    <!-- page.js fills in the title and the question from the JSON file -->
    <h1></h1>
    <p id="prompt"></p>

    <!-- The bar and the buttons side by side -->
    <div class="answer-row">
      <div id="answer-slots">
        <span class="answer-hint">Tippe auf ein Symbol</span>
      </div>
      <button type="button" id="check-button">Prüfen</button>
      <button type="button" id="backspace-button">⌫</button>
      <button type="button" id="clear-button">Leeren</button>
    </div>

    <!-- page.js writes "Richtig!" or "Noch nicht" here -->
    <p id="feedback"></p>

    <div id="symbol-keyboard"></div>
  </main>

  <script src="js/Keyboard.js"></script>
  <!-- type="module" is needed because page.js uses await -->
  <script type="module" src="js/page.js"></script>
</body>
</html>
